name: tests

on:
  push:
  pull_request:
  schedule:
    # Weekly fresh-install run: catches new upstream releases breaking the
    # install even when no code is changing. (GitHub pauses scheduled runs
    # after ~60 days without repo activity; any commit re-enables them.)
    - cron: "0 6 * * 1"

jobs:
  signal-tests:
    name: signal math (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_signal_processing.py -v

  full-tests:
    name: full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System libs for OpenCV (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v

  lock-file:
    name: known-good lock file still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pytest -v
